<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="container">
      <div class="nonprofit-header">
        <div id="orgLogo" class="org-logo-placeholder">Organization Logo</div>
        <div class="org-info">
          <h1 id="orgName" class="org-name">Food Pantry Management</h1>
          <p id="orgSubtitle" class="org-subtitle">Pickup Tracking System</p>
        </div>
      </div>

      <div class="top-bar">
        <a href="/" class="back-link">&#8592; Back to Home</a>
      </div>

      <div class="card" id="loginCard">
        <h1>Admin Login</h1>
        <p class="field-hint">Ask your coordinator for the username and password.</p>
        <form id="login">
          <input id="user" placeholder="Username" />
          <input id="pass" placeholder="Password" type="password" />
          <button class="btn-primary">Log In</button>
        </form>
        <div id="status" class="field-hint" style="margin-top:10px;text-align:center"></div>
      </div>

      <div class="card" id="adminActions" style="display:none">
        <div class="toolbar">
          <h1>Admin Dashboard</h1>
        </div>

        <div class="admin-section">
          <h3>Records</h3>
          <div class="admin-grid">
            <a href="/pickups.html" class="admin-btn">View All Pickups</a>
            <a href="/client.html" class="admin-btn">Client Intake Forms</a>
          </div>
        </div>

        <div class="admin-section">
          <h3>People</h3>
          <div class="admin-grid">
            <a href="/persons.html" class="admin-btn">Manage People</a>
          </div>
        </div>

        <div class="admin-section">
          <h3>Customize</h3>
          <div class="admin-grid">
            <a href="/settings.html" class="admin-btn">Organization Settings</a>
          </div>
        </div>

        <div class="admin-section">
          <h3>Export Data</h3>
          <div class="admin-grid">
            <button id="exportPdf" class="admin-btn">Download PDF Report</button>
            <button id="exportCsv" class="admin-btn">Download CSV Spreadsheet</button>
            <button id="exportJson" class="admin-btn">Download JSON Backup</button>
          </div>
          <div id="exportStatus" class="field-hint"></div>
        </div>

        <div class="admin-section" style="border:none">
          <div class="admin-grid">
            <button id="clearData" class="btn-ghost" style="color:var(--danger);border-color:rgba(224,36,36,0.2)">Delete All Data</button>
          </div>
        </div>

        <div class="admin-section" style="border:none;margin-bottom:0">
          <button id="logoutBtn" class="btn-ghost">Log Out</button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script>
      function toast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
      }
      const loginForm = document.getElementById('login');
      const loginCard = document.getElementById('loginCard');
      const actions = document.getElementById('adminActions');
      const statusEl = document.getElementById('status');
      const exportStatus = document.getElementById('exportStatus');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusEl.textContent = 'Please wait...';
        const user = document.getElementById('user').value.trim();
        const pass = document.getElementById('pass').value;
        try {
          const res = await fetch('/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: user, password: pass })});
          if (res.ok) {
            statusEl.textContent = '';
            loginCard.style.display = 'none';
            actions.style.display = 'block';
          } else {
            statusEl.textContent = 'Incorrect username or password. Try again.';
          }
        } catch (err) {
          statusEl.textContent = 'Could not connect to server.';
        }
      });

      function triggerDownload(url, filename) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || '';
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>a.remove(), 100);
      }

      document.getElementById('exportPdf').addEventListener('click', () => {
        exportStatus.textContent = 'Preparing PDF...';
        triggerDownload('/admin/export/pdf', 'pickups.pdf');
        setTimeout(()=> exportStatus.textContent = 'PDF download started.', 1500);
      });
      document.getElementById('exportCsv').addEventListener('click', () => {
        exportStatus.textContent = 'Preparing CSV...';
        triggerDownload('/admin/pickups/export', 'pickups.csv');
        setTimeout(()=> exportStatus.textContent = 'CSV download started.', 1500);
      });
      document.getElementById('exportJson').addEventListener('click', async () => {
        exportStatus.textContent = 'Fetching data...';
        try {
          const res = await fetch('/api/export');
          if (!res.ok) throw new Error('Unauthorized');
          const data = await res.json();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            triggerDownload(url, 'pickups.json');
            exportStatus.textContent = 'JSON download started.';
            setTimeout(()=>URL.revokeObjectURL(url), 2000);
        } catch (err) {
          exportStatus.textContent = 'Could not export. Try logging in again.';
        }
      });

      document.getElementById('clearData').addEventListener('click', async () => {
        if (!confirm('Delete ALL pickup records and people? This cannot be undone.')) return;
        if (!confirm('Are you sure? All data will be permanently removed.')) return;
        try {
          await fetch('/admin/clear-data', { method: 'POST' });
          toast('All data cleared. Starting fresh.');
          setTimeout(() => location.reload(), 1500);
        } catch (err) {
          toast('Could not clear data.');
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/admin/logout', { method: 'POST' });
        actions.style.display = 'none';
        loginCard.style.display = 'block';
        statusEl.textContent = 'Logged out successfully.';
      });

      fetch('/api/config')
        .then(res => res.json())
        .then(config => {
          document.title = `Admin - ${config.app.title}`;
          const orgLogo = document.getElementById('orgLogo');
          if (config.organization.logoUrl) {
            const img = document.createElement('img');
              img.src = config.organization.logoUrl;
              img.alt = config.organization.name;
              img.className = 'org-logo';
              img.onerror = function(){this.style.display='none'};
              orgLogo.parentNode.replaceChild(img, orgLogo);
          } else {
            orgLogo.textContent = config.organization.logoText;
          }
          document.getElementById('orgName').textContent = config.organization.name;
          document.getElementById('orgSubtitle').textContent = config.organization.subtitle;
        })
        .catch(err => console.error('Failed to load config:', err));
    </script>
  </body>
</html>
