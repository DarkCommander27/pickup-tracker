<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pickup Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="container">
      <div class="nonprofit-header">
        <div id="orgLogo" class="org-logo-placeholder">Organization Logo</div>
        <div class="org-info">
          <h1 id="orgName" class="org-name">Food Pantry Management</h1>
          <p id="orgSubtitle" class="org-subtitle">Pickup Tracking System</p>
        </div>
      </div>

      <div class="hero-card">
        <h1 id="appTitle">Pickup Tracker</h1>
        <p class="hero-desc">Record food pantry pickups with digital signatures.</p>
        <a href="/pickup.html" class="hero-btn">Sign a Pickup</a>
        <a href="/admin.html" class="hero-link">Admin Area &mdash; view records, manage people, export data</a>
      </div>
    </div>
    <script>
      fetch('/api/config')
        .then(res => res.json())
        .then(config => {
          document.title = config.app.title;
          const orgLogo = document.getElementById('orgLogo');
          if (config.organization.logoUrl) {
            const img = document.createElement('img');
              img.src = config.organization.logoUrl;
              img.alt = config.organization.name;
              img.className = 'org-logo';
              img.onerror = function(){this.style.display='none'};
              orgLogo.parentNode.replaceChild(img, orgLogo);
          } else {
            orgLogo.textContent = config.organization.logoText;
          }
          document.getElementById('orgName').textContent = config.organization.name;
          document.getElementById('orgSubtitle').textContent = config.organization.subtitle;
          document.getElementById('appTitle').textContent = config.app.title;
        })
        .catch(err => console.error('Failed to load config:', err));
    </script>
  </body>
</html>
