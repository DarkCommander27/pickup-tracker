<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pickup Tracker - Food Pantry Management</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="container">
      <div class="nonprofit-header">
        <div id="orgLogo" class="org-logo-placeholder">Organization Logo</div>
        <div class="org-info">
          <h1 id="orgName" class="org-name">Food Pantry Management</h1>
          <p id="orgSubtitle" class="org-subtitle">Pickup Tracking System</p>
        </div>
      </div>
      <div class="card">
        <h1 id="appTitle">Pickup Tracker</h1>
        <p class="muted">Run this on a laptop and open the pages from tablets on the same local network.</p>
        <div class="row">
          <div class="col"><a href="/persons.html"><button class="secondary">Manage People</button></a></div>
          <div class="col"><a href="/pickup.html"><button>Sign Pickup</button></a></div>
          <div class="col"><a href="/pickups.html"><button class="ghost">View Pickups</button></a></div>
        </div>
      </div>
    </div>
    <script>
      fetch('/api/config')
        .then(res => res.json())
        .then(config => {
          document.title = `${config.app.title} - ${config.organization.name}`;
          const orgLogo = document.getElementById('orgLogo');
          if (config.organization.logoUrl) {
            orgLogo.outerHTML = `<img src="${config.organization.logoUrl}" alt="${config.organization.name}" class="org-logo" />`;
          } else {
            orgLogo.textContent = config.organization.logoText;
          }
          document.getElementById('orgName').textContent = config.organization.name;
          document.getElementById('orgSubtitle').textContent = config.organization.subtitle;
          document.getElementById('appTitle').textContent = config.app.title;
        })
        .catch(err => console.error('Failed to load config:', err));
    </script>
  </body>
</html>
