<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Manage People - Pickup Tracker</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="container">
      <div class="nonprofit-header">
        <div id="orgLogo" class="org-logo-placeholder">Organization Logo</div>
        <div class="org-info">
          <h1 id="orgName" class="org-name">Food Pantry Management</h1>
          <p id="orgSubtitle" class="org-subtitle">Pickup Tracking System</p>
        </div>
      </div>
      <div class="card">
        <div class="toolbar">
          <h1>People</h1>
          <a href="/"><button class="ghost">Back</button></a>
        </div>

        <form id="personForm" class="card">
          <div class="row">
            <div class="col"><input id="name" placeholder="Full name" required /></div>
          </div>
          <div style="margin-top:8px"><button>Add person</button></div>
        </form>

  <h2 class="small muted">Existing people</h2>
  <div id="people" class="people-list card"></div>
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="/app.js"></script>
    <script>
      fetch('/api/config')
        .then(res => res.json())
        .then(config => {
          document.title = `Manage People - ${config.app.title}`;
          const orgLogo = document.getElementById('orgLogo');
          if (config.organization.logoUrl) {
            orgLogo.outerHTML = `<img src="${config.organization.logoUrl}" alt="${config.organization.name}" class="org-logo" />`;
          } else {
            orgLogo.textContent = config.organization.logoText;
          }
          document.getElementById('orgName').textContent = config.organization.name;
          document.getElementById('orgSubtitle').textContent = config.organization.subtitle;
        })
        .catch(err => console.error('Failed to load config:', err));
    </script>
  </body>
</html>
