<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Client Intake - Pickup Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="container">
      <div class="nonprofit-header">
        <div id="orgLogo" class="org-logo-placeholder">Organization Logo</div>
        <div class="org-info">
          <h1 id="orgName" class="org-name">Food Pantry Management</h1>
          <p id="orgSubtitle" class="org-subtitle">Pickup Tracking System</p>
        </div>
      </div>
      <div class="top-bar">
        <a href="/" class="back-link">&#8592; Back to Home</a>
      </div>
      <div class="card">
        <h2>Welcome! Please fill out your information</h2>
        <form id="clientForm">
          <label>Name
            <input id="name" name="name" required />
          </label>
          <label>Date
            <input id="date" name="date" type="date" required />
          </label>
          <label>Notes
            <textarea id="notes" name="notes" placeholder="Anything you'd like us to know?"></textarea>
          </label>
          <button type="submit" class="btn-primary">Submit</button>
        </form>
        <div id="thanks" style="display:none; margin-top:20px; color:green;">Thank you! Your information has been received.</div>
      </div>
    </div>
    <script>
      // Autofill date on load
      document.getElementById('date').value = new Date().toISOString().slice(0,10);

      document.getElementById('clientForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = {
          name: document.getElementById('name').value.trim(),
          date: document.getElementById('date').value,
          notes: document.getElementById('notes').value.trim()
        };
        await fetch('/api/client-intake', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        document.getElementById('clientForm').style.display = 'none';
        document.getElementById('thanks').style.display = 'block';
      });

      // Load configuration
      fetch('/api/config')
        .then(res => res.json())
        .then(config => {
          document.title = `Client Intake - ${config.app.title}`;
          const orgLogo = document.getElementById('orgLogo');
          if (config.organization.logoUrl) {
            const img = document.createElement('img');
              img.src = config.organization.logoUrl;
              img.alt = config.organization.name;
              img.className = 'org-logo';
              img.onerror = function(){this.style.display='none'};
              orgLogo.parentNode.replaceChild(img, orgLogo);
          } else {
            orgLogo.textContent = config.organization.logoText;
          }
          document.getElementById('orgName').textContent = config.organization.name;
          document.getElementById('orgSubtitle').textContent = config.organization.subtitle;
        })
        .catch(err => console.error('Failed to load config:', err));
    </script>
  </body>
</html>
