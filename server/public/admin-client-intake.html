<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin: Client Intake Data - Pickup Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <div class="container">
      <div class="nonprofit-header">
        <div id="orgLogo" class="org-logo-placeholder">Organization Logo</div>
        <div class="org-info">
          <h1 id="orgName" class="org-name">Food Pantry Management</h1>
          <p id="orgSubtitle" class="org-subtitle">Pickup Tracking System</p>
        </div>
      </div>
      <div class="top-bar">
        <a href="/admin.html" class="back-link">&#8592; Back to Admin</a>
      </div>
      <div class="card">
        <h1>Client Intake Submissions</h1>
      <button class="admin-btn" id="export">Export CSV</button>
      <table id="intakeTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Date</th>
            <th>Notes</th>
            <th>Submitted</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <script>
      function esc(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }
      async function loadIntake() {
        const res = await fetch('/admin/client-intake');
        if (res.status === 401) { document.body.innerHTML = '<div class="container"><p style="text-align:center;padding:40px">Session expired. <a href="/admin.html">Log in again</a>.</p></div>'; return; }
        const data = await res.json();
        const tbody = document.querySelector('#intakeTable tbody');
  tbody.innerHTML = data.map(e => `<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.date||'')}</td><td>${esc(e.notes)}</td><td>${esc(e.submitted)}</td></tr>`).join('');
      }
      loadIntake();
      document.getElementById('export').onclick = async () => {
        window.location = '/admin/client-intake/export';
      };

      // Load configuration
      fetch('/api/config')
        .then(res => res.json())
        .then(config => {
          document.title = `Admin: Client Intake Data - ${config.app.title}`;
          const orgLogo = document.getElementById('orgLogo');
          if (config.organization.logoUrl) {
            const img = document.createElement('img');
              img.src = config.organization.logoUrl;
              img.alt = config.organization.name;
              img.className = 'org-logo';
              img.onerror = function(){this.style.display='none'};
              orgLogo.parentNode.replaceChild(img, orgLogo);
          } else {
            orgLogo.textContent = config.organization.logoText;
          }
          document.getElementById('orgName').textContent = config.organization.name;
          document.getElementById('orgSubtitle').textContent = config.organization.subtitle;
        })
        .catch(err => console.error('Failed to load config:', err));
    </script>
  </body>
</html>
