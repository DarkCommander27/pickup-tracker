version: '3.8'

services:
  pickup-tracker:
    build: .
    container_name: pickup-tracker
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-password}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-in-production}
    volumes:
      - ./server/db.json:/app/server/db.json
      - ./server/config.json:/app/server/config.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
